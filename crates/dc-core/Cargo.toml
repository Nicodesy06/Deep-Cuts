[package]
name = "dc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
dunce = "1.0.5"
lofty = "0.25.4"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
thiserror = "2.0.21"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
