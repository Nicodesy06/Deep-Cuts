name: CI

on:
  push:
  pull_request:

jobs:
  # Known vulnerabilities in Rust and npm dependencies (audit DC-44).
  # RUSTSEC-2026-0187 (lopdf stack overflow when *parsing* nested PDFs) is
  # ignored: lopdf comes with printpdf, which Deep Cuts only uses to write
  # PDF track lists; no PDF is ever read.
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --ignore RUSTSEC-2026-0187
      - name: npm audit
        run: |
          npm audit --audit-level=high
          npm --prefix ui audit --audit-level=high

  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg

      - name: macOS ffmpeg (multi-format tests)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI typecheck + unit tests
        working-directory: ui
        run: |
          npm run typecheck
          npm test

      - name: Rust tests (core, CLI, desktop shell)
        run: cargo test --workspace --release

      - name: Build installers (unsigned)
        run: npx tauri build

      # Install the real package and run it in smoke mode: import, analysis with
      # the bundled model, and playback in the platform webview (scripts/installer_smoke.py).
      - name: Installer smoke test (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb pulseaudio gstreamer1.0-plugins-good gstreamer1.0-libav
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          pulseaudio --start --exit-idle-time=-1 -n --load=module-null-sink --load=module-native-protocol-unix
          xvfb-run -a python3 scripts/installer_smoke.py /usr/bin/deep-cuts "$RUNNER_TEMP/smoke"

      - name: Installer smoke test (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Deep Cuts" -Filter *.exe -Recurse | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Write-Host "installed: $($exe.FullName)"
          python scripts/installer_smoke.py $exe.FullName "$env:RUNNER_TEMP\smoke"

      - name: Installer smoke test (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /Volumes/deepcuts -nobrowse
          cp -R "/Volumes/deepcuts/Deep Cuts.app" "$RUNNER_TEMP/"
          hdiutil detach /Volumes/deepcuts
          exe=$(ls "$RUNNER_TEMP/Deep Cuts.app/Contents/MacOS/"* | head -1)
          python3 scripts/installer_smoke.py "$exe" "$RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@v4
        with:
          name: deep-cuts-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
          if-no-files-found: warn
