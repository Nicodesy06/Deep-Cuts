name: Release

# Builds the Windows and macOS installers and attaches them to a GitHub
# pre-release "v<version>" (version from tauri.conf.json). Runs on a pushed
# v* tag, or on a branch push whose commit message contains "[release]"
# (tauri-action then creates the tag on that commit).
on:
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          # ONNX Runtime has no prebuilt binaries for Intel Macs: that build
          # leaves out the local audio model (everything else is the same).
          - os: macos-latest
            args: "--target x86_64-apple-darwin -- --no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Deep Cuts v__VERSION__
          releaseCommitish: ${{ github.sha }}
          prerelease: true
          args: ${{ matrix.args }}
          releaseBody: |
            Unsigned test build of Deep Cuts (free, local, offline DJ library manager).

            **Windows 10/11 (x64)** — download `Deep.Cuts_*_x64-setup.exe` (or the `.msi`). The installer is not code-signed, so SmartScreen shows "Windows protected your PC": click *More info* › *Run anyway*.

            **macOS (Apple silicon: `aarch64.dmg`, Intel: `x64.dmg`; the Intel build has no local audio model — genre/mood suggestions from the model are missing there)** — open the DMG and drag Deep Cuts to Applications. The app is not notarised: the first time, right-click the app › *Open* › *Open* (or run `xattr -dr com.apple.quarantine "/Applications/Deep Cuts.app"`).

            Your music files are never modified unless you explicitly write tags; the library lives in your user data folder. Checklist for testing on real hardware and DJ software: `docs/TEST_PLAN.md`.

            Optional model downloads (offered inside the app, none required): Discogs styles + mood/feel/emotion pack (MTG, non-commercial licence, 26 MB + heads), "accurate styles" with MAEST (MTG, non-commercial, 332 MB) and text search by description with LAION-CLAP (Apache-2.0, about 400 MB). Measurements: `docs/AI_VALIDATION.md`.

            ---

            **Windows** — scarica `Deep.Cuts_*_x64-setup.exe` (o il `.msi`). Non è firmato: su "Windows ha protetto il PC" clicca *Ulteriori informazioni* › *Esegui comunque*.

            Modelli facoltativi scaricabili dall'app: stili Discogs + mood/emozione (MTG, licenza non commerciale), "stili accurati" MAEST (MTG, non commerciale, 332 MB), ricerca per descrizione LAION-CLAP (Apache-2.0, circa 400 MB).

            **macOS** — `aarch64.dmg` per Apple silicon (M1–M4), `x64.dmg` per Mac Intel (senza il modello audio locale). Trascina Deep Cuts in Applicazioni; la prima volta tasto destro sull'app › *Apri* › *Apri*.
