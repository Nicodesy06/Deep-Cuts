[workspace]
resolver = "2"
members = ["crates/dc-core", "crates/dc-cli", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nicodesy06/Deep-Cuts"

[profile.dev.package."*"]
# Audio DSP is unbearably slow unoptimised; keep our own code debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
